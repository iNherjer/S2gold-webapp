name: Build Innoextract WebAssembly (experimental)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-innoextract-wasm.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout upstream WASM port
        uses: actions/checkout@v4
        with:
          repository: Mobica/innoextract-wasm
          ref: wasm-main
          path: innoextract-wasm

      - name: Repair upstream Boost archive URL and fail fast
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("innoextract-wasm")
          deps = root / "utils" / "build_deps.sh"
          old = "https://boostorg.jfrog.io/artifactory/main/release/1.82.0/source/boost_1_82_0.tar.bz2"
          new = "https://archives.boost.org/release/1.82.0/source/boost_1_82_0.tar.bz2"
          s = deps.read_text()
          assert old in s, "Upstream Boost URL changed – inspect before patching"
          s = s.replace(old, new)
          deps.write_text(s.replace("#!/bin/bash", "#!/bin/bash" + chr(10) + "set -e", 1))
          build = root / "build.sh"
          build.write_text(build.read_text().replace("#!/bin/bash", "#!/bin/bash" + chr(10) + "set -e", 1))
          print("Patched Boost URL:", new)
          PY
          curl -fIL --retry 3 --max-time 60 https://archives.boost.org/release/1.82.0/source/boost_1_82_0.tar.bz2

      - name: Patch streaming ZIP export and preserve final buffer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("innoextract-wasm/src/wasm/emjs.cpp")
          s = path.read_text()
          def patch(old, new, label):
              global s
              assert old in s, "Upstream source changed: " + label
              s = s.replace(old, new, 1)
          patch("EM_JS(void, close_int, (void), {", "EM_ASYNC_JS(void, close_int, (void), {", "async close signature")
          patch("Module.writer.close();", "await Module.writer.close();", "await writer close")
          patch("new Uint8Array(Module.HEAPU8.buffer, ptr, size*n);", "new Uint8Array(Module.HEAPU8.buffer, ptr, size*n).slice();", "copy stream buffer")
          patch("void close() {\n  close_int();\n}", "void close() {\n  if (bpos > 0) {\n    write_int(buff, 1, bpos);\n    bpos = 0;\n  }\n  close_int();\n}", "final buffered ZIP data")
          path.write_text(s)
          print("WASM streaming ZIP export patched successfully")
          PY

      - name: Build browser target with upstream Dockerfile
        run: |
          docker build --progress=plain -t s2gold-innoextract-wasm ./innoextract-wasm

      - name: Copy generated browser distribution
        run: |
          id=$(docker create s2gold-innoextract-wasm)
          mkdir -p dist/innoextract
          docker cp "$id:/root/innoextract/build/." dist/innoextract/
          docker rm "$id"
          echo "Output files:"
          find dist/innoextract -maxdepth 2 -type f -printf '%p %s bytes\n'
          test -s dist/innoextract/innoextract.wasm
          test -s dist/innoextract/innoextract.js

      - name: Archive compiled browser runtime
        uses: actions/upload-artifact@v4
        with:
          name: innoextract-wasm-experimental
          path: dist/innoextract/
          retention-days: 14
