name: Build Innoextract WebAssembly (experimental)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-innoextract-wasm.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout upstream WASM port
        uses: actions/checkout@v4
        with:
          repository: Mobica/innoextract-wasm
          ref: wasm-main
          path: innoextract-wasm

      - name: Repair upstream Boost archive URL and fail fast
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("innoextract-wasm")
          deps = root / "utils" / "build_deps.sh"
          old = "https://boostorg.jfrog.io/artifactory/main/release/1.82.0/source/boost_1_82_0.tar.bz2"
          new = "https://archives.boost.org/release/1.82.0/source/boost_1_82_0.tar.bz2"
          s = deps.read_text()
          assert old in s, "Upstream Boost URL changed – inspect before patching"
          s = s.replace(old, new)
          deps.write_text(s.replace("#!/bin/bash", "#!/bin/bash" + chr(10) + "set -e", 1))
          build = root / "build.sh"
          build.write_text(build.read_text().replace("#!/bin/bash", "#!/bin/bash" + chr(10) + "set -e", 1))
          print("Patched Boost URL:", new)
          PY
          curl -fIL --retry 3 --max-time 60 https://archives.boost.org/release/1.82.0/source/boost_1_82_0.tar.bz2

      - name: Patch ZIP output with ordered nonblocking stream writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("innoextract-wasm/src/wasm/emjs.cpp")
          s = p.read_text()
          start = s.index("EM_ASYNC_JS(size_t, write_int,")
          end = s.index("EM_ASYNC_JS(void, abort_int,", start)
          new = """EM_JS(void, write_int, (const void *ptr, size_t size, size_t n), {
            const bytes = new Uint8Array(Module.HEAPU8.buffer, ptr, size*n).slice();
            Module.zipQueue = (Module.zipQueue || Promise.resolve()).then(() => Module.writer.write(bytes));
            Module.zipQueue.catch(e => { Module.zipError = String(e); console.error("ZIP write failed", e); });
          });
          
          EM_JS(void, close_int, (void), {
            Module.zipQueue = (Module.zipQueue || Promise.resolve()).then(async () => {
              if (!Module.writer) throw new Error("ZIP writer missing");
              await Module.writer.close();
              innoLog("zipstream: close completed");
            });
            Module.zipQueue.catch(e => { Module.zipError = String(e); console.error("ZIP close failed", e); });
          });
          
          """
          s = s[:start] + new + s[end:]
          import re
          replacement = chr(10).join([
              "void close() {",
              "  if (bpos > 0) {",
              "    write_int(buff, 1, bpos);",
              "    bpos = 0;",
              "  }",
              "  close_int();",
              "}"
          ])
          s, changes = re.subn(r"void close\(\)\s*\{\s*close_int\(\);\s*\}", lambda _: replacement, s, count=1)
          assert changes == 1, "Close implementation changed upstream"
          needle2 = "  bpos = 0; // Reset output buffer"
          replace2 = needle2 + chr(10) + "  EM_ASM({ Module.zipQueue = Promise.resolve(); Module.zipError = null; });"
          assert needle2 in s
          s = s.replace(needle2, replace2, 1)
          p.write_text(s)
          print("Patched sequential asynchronous writer queue and final buffer flush")
          PY

      - name: Bound ZIP buffering and reduce startup memory for Safari
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("innoextract-wasm/src/wasm/emjs.cpp")
          s = p.read_text()
          original = "char buff[64 * 1024 * 1024];"
          assert original in s
          s = s.replace(original, "char buff[2 * 1024 * 1024];", 1)
          original = "Module.zipQueue = (Module.zipQueue || Promise.resolve()).then(() => Module.writer.write(bytes));"
          replacement = "Module.zipPendingBytes = (Module.zipPendingBytes || 0) + bytes.byteLength;" + chr(10) + "  Module.zipQueue = (Module.zipQueue || Promise.resolve()).then(async () => { try { await Module.writer.write(bytes); } finally { Module.zipPendingBytes -= bytes.byteLength; } });"
          assert original in s
          s = s.replace(original, replacement, 1)
          original = "    write_int(buff, 1, bpos);"
          replacement = original + chr(10) + "    while (EM_ASM_INT({ return Module.zipPendingBytes || 0; }) > 8 * 1024 * 1024) { emscripten_sleep(10); }"
          assert original in s
          s = s.replace(original, replacement)
          original = "Module.zipQueue = Promise.resolve(); Module.zipError = null;"
          replacement = original + " Module.zipPendingBytes = 0;"
          assert original in s
          s = s.replace(original, replacement, 1)
          p.write_text(s)
          cmake = Path("innoextract-wasm/CMakeLists.txt")
          c = cmake.read_text()
          original = "-sINITIAL_MEMORY=1024MB -sSTACK_SIZE=512MB"
          assert original in c
          c = c.replace(original, "-sINITIAL_MEMORY=768MB -sSTACK_SIZE=64MB", 1)
          cmake.write_text(c)
          print("ZIP buffer 2 MiB, queue backpressure 8 MiB, WASM initial 768 MiB, stack 64 MiB")
          PY


      - name: Use iOS local-file ZIP export with explicit download button
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("innoextract-wasm/src/wasm/emjs.cpp")
          s = p.read_text()
          a = s.index("EM_JS(void, open_int,")
          b = s.index("EM_ASYNC_JS(void, abort_int,", a)
          replacement = """EM_JS(void, open_int, (const char *name, const char *modes, uint64_t output_size), {
            const rawName = UTF8ToString(name).split(/[\\\\/]/).pop();
            Module.zipName = /\\\\.zip$/i.test(rawName) ? rawName : rawName + ".zip";
            Module.writer = null;
            Module.zipError = null;
            const old = document.getElementById("s2gold-download");
            if (old) old.remove();
            Module.zipQueue = navigator.storage.getDirectory()
              .then(root => root.getFileHandle("s2gold-export.zip", {create:true}))
              .then(handle => { Module.zipFileHandle = handle; return handle.createWritable(); })
              .then(writer => { Module.writer = writer; innoLog("OPFS ZIP writer ready"); });
            Module.zipQueue.catch(err => {
              Module.zipError = String(err);
              console.error("OPFS initialization failed", err);
              document.getElementById("status").textContent = "ZIP-Speicherfehler: " + err;
            });
          });
          
          EM_JS(void, write_int, (const void *ptr, size_t size, size_t n), {
            const bytes = new Uint8Array(Module.HEAPU8.buffer, ptr, size*n).slice();
            Module.zipPendingBytes = (Module.zipPendingBytes || 0) + bytes.byteLength;
            Module.zipQueue = Module.zipQueue.then(async () => {
              try { await Module.writer.write(bytes); }
              finally { Module.zipPendingBytes -= bytes.byteLength; }
            });
            Module.zipQueue.catch(err => {
              Module.zipError = String(err);
              console.error("OPFS ZIP write failed", err);
            });
          });
          
          EM_JS(void, close_int, (void), {
            Module.zipQueue = Module.zipQueue.then(async () => {
              if (!Module.writer || !Module.zipFileHandle) throw new Error("ZIP-Writer fehlt");
              await Module.writer.close();
              const file = await Module.zipFileHandle.getFile();
              if (file.size < 22) throw new Error("ZIP unvollständig: nur " + file.size + " Bytes");
              const head = new Uint8Array(await file.slice(0,4).arrayBuffer());
              if (head[0] !== 0x50 || head[1] !== 0x4b || head[2] !== 0x03 || head[3] !== 0x04)
                throw new Error("ZIP-Dateianfang ungültig");
              const tail = new Uint8Array(await file.slice(Math.max(0, file.size-65557)).arrayBuffer());
              let found = false;
              for (let i=tail.length-22; i>=0; i--) {
                if (tail[i]===0x50 && tail[i+1]===0x4b && tail[i+2]===0x05 && tail[i+3]===0x06) {
                  found=true; break;
                }
              }
              if (!found) throw new Error("ZIP-Endverzeichnis fehlt");
              if (Module.zipDownloadUrl) URL.revokeObjectURL(Module.zipDownloadUrl);
              Module.zipDownloadUrl = URL.createObjectURL(file);
              const link = document.createElement("a");
              link.id = "s2gold-download";
              link.href = Module.zipDownloadUrl;
              link.download = Module.zipName || "s2gold-export.zip";
              link.textContent = "⬇ ZIP herunterladen (" + (file.size/1048576).toFixed(1) + " MiB)";
              link.style.cssText = "display:block;position:fixed;z-index:99999;bottom:16%;left:6%;right:6%;padding:18px;background:#f5c84b;color:#141a14;text-align:center;font:bold 19px system-ui;border-radius:13px;box-shadow:0 6px 30px #0009";
              document.body.appendChild(link);
              innoLog("OPFS ZIP validated; user download available");
              const status = document.getElementById("status");
              if (status) status.textContent = "ZIP fertig. Jetzt den gelben Download-Knopf antippen.";
            }).catch(err => {
              Module.zipError = String(err);
              console.error("OPFS ZIP finalization failed", err);
              const status = document.getElementById("status");
              if (status) status.textContent = "ZIP-Export fehlgeschlagen: " + err;
              const warning = document.createElement("div");
              warning.style.cssText = "position:fixed;z-index:99999;bottom:15%;left:5%;right:5%;padding:20px;background:#921c28;color:white;font:16px system-ui;border-radius:12px";
              warning.textContent = "ZIP-Export fehlgeschlagen: " + err;
              document.body.appendChild(warning);
            });
          });
          
          """
          s = s[:a] + replacement + s[b:]
          p.write_text(s)
          print("Replaced StreamSaver with OPFS ZIP writer plus explicit download link")
          PY

      - name: Build browser target with upstream Dockerfile
        run: |
          docker build --progress=plain -t s2gold-innoextract-wasm ./innoextract-wasm

      - name: Copy generated browser distribution
        run: |
          id=$(docker create s2gold-innoextract-wasm)
          mkdir -p dist/innoextract
          docker cp "$id:/root/innoextract/build/." dist/innoextract/
          docker rm "$id"
          echo "Output files:"
          find dist/innoextract -maxdepth 2 -type f -printf '%p %s bytes\n'
          test -s dist/innoextract/innoextract.wasm
          test -s dist/innoextract/innoextract.js

      - name: Archive compiled browser runtime
        uses: actions/upload-artifact@v4
        with:
          name: innoextract-wasm-experimental
          path: dist/innoextract/
          retention-days: 14
