name: Deploy S2Gold webplayer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Stage static frontend
        run: |
          set -euo pipefail
          mkdir -p site/extractor
          cp index.html installer-check.js updater.js sw.js version.json .nojekyll site/
          if test -f extractor/index.html; then cp extractor/index.html site/extractor/index.html; fi
      - name: Try to bundle last validated extractor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pinned known-good artifact so a failing experimental WASM build
          # cannot break a normal Pages deployment.
          RUN_ID=42251385007
          mkdir -p build-artifact
          if gh run download "$RUN_ID" --repo "${{ github.repository }}" --name innoextract-wasm-experimental --dir build-artifact \
             && test -s build-artifact/innoextract.wasm \
             && test -s build-artifact/innoextract.js \
             && test -s build-artifact/index.html; then
            cp build-artifact/innoextract.wasm build-artifact/innoextract.js build-artifact/index.html site/extractor/
            if test -f build-artifact/innoextract.html; then cp build-artifact/innoextract.html site/extractor/; fi
            for folder in js css img; do
              if test -d "build-artifact/$folder"; then cp -R "build-artifact/$folder" site/extractor/; fi
            done
            echo "Validated extractor successfully included"
          else
            echo "::warning::Validated WASM artifact unavailable. Deploying website with diagnostic extractor page."
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
