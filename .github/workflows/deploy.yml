name: Deploy S2Gold webplayer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Stage static frontend
        run: |
          set -euo pipefail
          mkdir -p site/extractor
          cp index.html installer-check.js updater.js sw.js version.json .nojekyll site/
          if test -f extractor/index.html; then cp extractor/index.html site/extractor/index.html; fi
      - name: Bundle newest successful WASM extractor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build-artifact
          RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow build-innoextract-wasm.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$RUN_ID" ]]; then
            echo "::warning::No successful WASM run available; publishing diagnostic fallback."
            exit 0
          fi
          echo "WASM build run: $RUN_ID"
          if gh run download "$RUN_ID" --repo "${{ github.repository }}" --name innoextract-wasm-experimental --dir build-artifact \
             && test -s build-artifact/innoextract.wasm \
             && test -s build-artifact/innoextract.js \
             && test -s build-artifact/index.html; then
            cp build-artifact/innoextract.wasm build-artifact/innoextract.js build-artifact/index.html site/extractor/
            if test -f build-artifact/innoextract.html; then cp build-artifact/innoextract.html site/extractor/; fi
            for folder in js css img; do
              if test -d "build-artifact/$folder"; then cp -R "build-artifact/$folder" site/extractor/; fi
            done
            echo "$RUN_ID" > site/extractor/build-id.txt
            echo "Bundled WASM build $RUN_ID"
          else
            echo "::warning::Could not download WASM build $RUN_ID; publishing diagnostic fallback."
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
