name: Deploy S2Gold webplayer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Build Innoextract WebAssembly (experimental)']
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Stage static frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/extractor
          cp index.html installer-check.js updater.js sw.js version.json .nojekyll site/
      - name: Download tested WASM build artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build-artifact
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow build-innoextract-wasm.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$RUN_ID"
          echo "Using successful WASM build run: $RUN_ID"
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name innoextract-wasm-experimental --dir build-artifact
          test -s build-artifact/innoextract.wasm
          test -s build-artifact/innoextract.js
          test -s build-artifact/index.html
          cp build-artifact/innoextract.wasm build-artifact/innoextract.js build-artifact/index.html build-artifact/innoextract.html site/extractor/
          for folder in js css img; do
            if test -d "build-artifact/$folder"; then cp -R "build-artifact/$folder" site/extractor/; fi
          done
          test -s site/extractor/innoextract.wasm
          echo "Extractor browser assets staged successfully."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
